<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI信息网</title>
<script type="module" src="/static/app.js"></script>
</head>
<body>
<div class="shell">
  <header>
    <div class="site-title">AI信息网</div>
    <div class="menu">
      <a href="/account" data-auth>账户中心</a>
      <a href="/login" data-auth>登录</a>
      <a href="/sources" data-auth>信息源</a>
      <a href="/search" data-auth>搜索</a>
    </div>
  </header>
  <nav class="category-nav" id="category-nav" aria-label="内容分类"></nav>
  <div class="masthead">
    <form class="search-form" id="search-form">
      <input id="search-input" type="search" placeholder="搜索标题、摘要、来源或标签" aria-label="搜索平台内容">
      <button type="submit">搜索</button>
    </form>
    <div class="account-status" id="account-status"></div>
  </div>
  <div id="view"></div>
  <button id="assistant-launcher" type="button" aria-haspopup="dialog">
    <span class="assistant-badge" aria-hidden="true">AI</span>助手
  </button>
  <div id="assistant-host" role="dialog" aria-modal="false" aria-label="AI助手" hidden></div>
</div>

</body>
</html>
